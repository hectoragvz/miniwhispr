[package]
name = "miniwhispr"
version = "0.1.0"
description = "Hold Ctrl + Space, speak, and clean text lands where you are typing"
authors = ["hectoragvz"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "miniwhispr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
log = "0.4"
# macOS login items (SMAppService). v1 is macOS only (ADR 0001).
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[dev-dependencies]
tempfile = "3.27.0"
