[package]
name = "miniwhispr"
version = "0.1.0"
description = "Hold Ctrl + Space, speak, and clean text lands where you are typing"
authors = ["hectoragvz"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "miniwhispr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# Microphone capture and resampling to 16 kHz.
cpal = "0.18.2"
rubato = "5.1.0"
# Groq API calls. Blocking, as the Dictation core runs on its own thread.
reqwest = { version = "0.13.5", features = ["blocking", "multipart", "json"] }
# The Groq API key lives in the macOS Keychain.
security-framework = "3.7.0"
# macOS APIs. v1 is macOS only (ADR 0001).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSound", "NSWindow", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSApplication"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
